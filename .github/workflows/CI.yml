name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  actions: read
  checks: write  # Важно: разрешение на создание отчётов

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test Report      # Шаг с репортером
        uses: dorny/test-reporter@v1
        if: success() || failure()  # Запускается даже если тесты упали
        with:
          name: JEST Tests           # Название отчета в интерфейсе
          path: reports/jest-*.xml   # Путь к файлам с результатами
          reporter: jest-junit        # Формат файла